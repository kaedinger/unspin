name: Build & Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+-dev'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compile unspind
        run: make build-daemon

      - name: Build TXZ package
        run: make package VERSION=${{ github.ref_name }}

      - name: Update .plg version
        run: make update-plg VERSION=${{ github.ref_name }}

      # `make package` (above) already recomputes the SHA256 of the just-built TXZ
      # and writes it into unspin.plg, but that only changes this runner's checkout.
      # pluginURL points at raw.githubusercontent.com/main/unspin.plg, so unless we
      # push the corrected file back to main, everyone keeps fetching whatever
      # (stale) hash was last committed by hand - which silently breaks installs.
      - name: Publish corrected .plg to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unspin.plg
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync unspin.plg version/SHA256 for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *-dev ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            $PRERELEASE \
            --generate-notes \
            "pkg/unspin-${{ github.ref_name }}-x86_64-1.txz" \
            "unspin.plg"
